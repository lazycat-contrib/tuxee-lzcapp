version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: tuxee
build:
  toolchains: []
  run_buildscript: false
images:
  - id: tuxee
    target: service
    service: tuxee
    source: agent0ai/tuxee
    channel: stable
    sort: semver
    tag_regex: ^v?[0-9]+[.][0-9]+[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
stores:
  official:
    enabled: false
  private:
    enabled: true
    name: Tuxee
    summary: 容器里的 Linux 桌面，浏览器登录即可使用
    skip_if_version_exists: true
